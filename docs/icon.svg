<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- NV drawn as one line: up, down the diagonal, up again (N), then down and up (V).
       The line is cut flat along the top and bottom, like capitals. -->
  <rect width="512" height="512" fill="#141414"/>
  <clipPath id="caps"><rect x="0" y="108" width="512" height="296"/></clipPath>
  <path clip-path="url(#caps)" d="M83 460V108L228 404V108L328 404L448 48.8" fill="none" stroke="#e78fbf" stroke-width="54" stroke-linejoin="miter" stroke-miterlimit="20"/>
</svg>
